<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multiplication Square</title>
  <style>
    :root {
      --bg: #FFF8E7;
      --primary: #FF6B35;
      --primary-dark: #e05520;
      --secondary: #4ECDC4;
      --header-row: #FFD93D;
      --header-col: #6BCF7F;
      --header-corner: #B8E0C8;
      --cell-bg: #ffffff;
      --correct: #6BCF7F;
      --wrong: #FF4757;
      --clue-row: #FFFACD;
      --text: #2D3436;
      --muted: #888;
      --border: #ddd;
      --shadow: 0 2px 12px rgba(0,0,0,0.08);
      --radius: 10px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 1.1rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem;
    }

    .hidden { display: none !important; }

    /* ── Buttons ── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.6rem 1.4rem;
      border: none;
      border-radius: var(--radius);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s, background 0.15s;
    }
    .btn:active { transform: scale(0.96); }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-secondary { background: #e0e0e0; color: var(--text); }
    .btn-secondary:hover { background: #ccc; }
    .btn-small { padding: 0.35rem 0.8rem; font-size: 0.85rem; }
    .btn-lg { padding: 0.9rem 2.2rem; font-size: 1.15rem; }

    /* ── Config Screen ── */
    #screen-config {
      width: 100%;
      max-width: 620px;
      display: flex;
      flex-direction: column;
      gap: 1.4rem;
      padding: 1.5rem;
    }

    #screen-config h1 {
      font-size: 2rem;
      color: var(--primary);
      text-align: center;
      letter-spacing: -0.5px;
    }

    .config-card {
      background: white;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.2rem 1.4rem;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    .config-card h2 {
      font-size: 1rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
    }

    /* Number checkboxes */
    #number-checkboxes {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .num-checkbox-label {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 2.6rem;
      height: 2.6rem;
      border-radius: 8px;
      border: 2px solid var(--border);
      background: white;
      cursor: pointer;
      font-weight: 700;
      font-size: 1.1rem;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
      user-select: none;
    }
    .num-checkbox-label input { display: none; }
    .num-checkbox-label.checked {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }

    .checkbox-actions {
      display: flex;
      gap: 0.5rem;
    }

    /* Difficulty buttons */
    #difficulty-buttons {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .diff-btn {
      flex: 1;
      min-width: 90px;
      padding: 0.6rem 0.5rem;
      border: 2px solid var(--border);
      border-radius: 8px;
      background: white;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .diff-btn.selected {
      background: var(--secondary);
      border-color: var(--secondary);
      color: white;
    }

    /* Goal config */
    #goal-config {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      flex-wrap: wrap;
    }

    .goal-radio-label {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      cursor: pointer;
      font-weight: 600;
    }

    #goal-value {
      width: 5rem;
      padding: 0.4rem 0.6rem;
      border: 2px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      text-align: center;
    }

    #goal-unit {
      color: var(--muted);
      font-weight: 500;
    }

    #config-error {
      color: var(--wrong);
      font-size: 0.9rem;
      font-weight: 600;
    }

    /* ── Game Screen ── */
    #screen-game {
      width: 100%;
      max-width: 900px;
      flex-direction: column;
      gap: 1rem;
    }
    #screen-game:not(.hidden) { display: flex; }

    #game-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: white;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 0.7rem 1.2rem;
      gap: 1rem;
    }

    #progress-display {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text);
      min-width: 120px;
    }

    #progress-bar-wrap {
      flex: 1;
      height: 10px;
      background: #eee;
      border-radius: 999px;
      overflow: hidden;
    }
    #progress-bar {
      height: 100%;
      background: var(--primary);
      border-radius: 999px;
      transition: width 0.3s ease;
      width: 0%;
    }

    .game-header-actions { display: flex; gap: 0.5rem; }

    /* Grid container */
    #grid-container {
      overflow: auto;
      background: white;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 0.5rem;
    }

    #multiplication-grid {
      border-collapse: collapse;
      margin: 0 auto;
    }

    #multiplication-grid th,
    #multiplication-grid td {
      min-width: 3rem;
      height: 3rem;
      text-align: center;
      vertical-align: middle;
      border: 1px solid var(--border);
      font-size: 1.05rem;
      font-weight: 500;
      padding: 0.2rem;
    }

    #multiplication-grid thead th {
      background: var(--header-col);
      font-weight: 700;
      font-size: 1.1rem;
      position: sticky;
      top: 0;
      z-index: 2;
    }

    #multiplication-grid thead th:first-child {
      background: var(--header-corner);
      position: sticky;
      left: 0;
      z-index: 3;
    }

    #multiplication-grid tbody th {
      background: var(--header-row);
      font-weight: 700;
      font-size: 1.1rem;
      position: sticky;
      left: 0;
      z-index: 1;
    }

    #multiplication-grid td { background: var(--cell-bg); }

    /* Hidden input cells */
    .cell-input {
      width: 100%;
      height: 100%;
      min-width: 2.4rem;
      min-height: 2.4rem;
      text-align: center;
      border: 2px dashed #bbb;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 700;
      background: #FFFDE7;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
      padding: 0;
    }
    .cell-input:focus {
      border-color: var(--primary);
      background: #FFF3E0;
    }

    /* Clue row in division mode */
    .clue-row td, .clue-row th { background: var(--clue-row) !important; font-weight: 700; }
    .clue-row-label { background: #FFE082 !important; }

    /* Dimmed cells in division mode */
    .cell-dim { opacity: 0.35; }

    /* Answer reveal */
    .cell-revealed-text {
      font-weight: 700;
      font-size: 1.05rem;
    }

    /* Submit row */
    #submit-row {
      display: flex;
      justify-content: center;
    }

    /* ── Animations ── */
    @keyframes flash-correct {
      0%   { background-color: var(--correct); transform: scale(1.15); }
      60%  { background-color: #c8f7d8; transform: scale(1.05); }
      100% { background-color: var(--cell-bg); transform: scale(1); }
    }
    @keyframes flash-correct-header {
      0%   { background-color: var(--correct); transform: scale(1.15); }
      100% { background-color: var(--header-col); transform: scale(1); }
    }
    @keyframes shake-wrong {
      0%,100% { transform: translateX(0); background-color: var(--wrong); }
      20%,60% { transform: translateX(-6px); }
      40%,80% { transform: translateX( 6px); }
    }
    @keyframes timer-pulse {
      0%,100% { opacity: 1; }
      50%      { opacity: 0.45; }
    }
    @keyframes slide-in {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .animate-correct     { animation: flash-correct 0.55s ease forwards; }
    .animate-correct-hdr { animation: flash-correct-header 0.55s ease forwards; }
    .animate-wrong       { animation: shake-wrong 0.45s ease forwards; }
    .animate-pulse       { animation: timer-pulse 1s ease infinite; }
    .grid-enter          { animation: slide-in 0.25s ease; }

    /* ── End Screen ── */
    #screen-end {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.4rem;
      padding: 2rem 1.5rem;
      text-align: center;
    }

    #screen-end h1 { font-size: 2.2rem; color: var(--primary); }

    .score-card {
      background: white;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.5rem 2rem;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
    }

    .score-row {
      display: flex;
      justify-content: space-between;
      font-size: 1.05rem;
    }
    .score-row .score-val { font-weight: 700; color: var(--primary); }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      #multiplication-grid th,
      #multiplication-grid td {
        min-width: 2.2rem;
        height: 2.5rem;
        font-size: 0.9rem;
      }
      .cell-input { font-size: 0.9rem; }
      #screen-config { padding: 0.75rem; }
    }
  </style>
</head>
<body>

<!-- ══════════════ CONFIG SCREEN ══════════════ -->
<div id="screen-config">
  <h1>✖ Multiplication Square</h1>

  <div class="config-card">
    <h2>Which numbers?</h2>
    <div id="number-checkboxes"></div>
    <div class="checkbox-actions">
      <button class="btn btn-secondary btn-small" id="btn-select-all">Select all</button>
      <button class="btn btn-secondary btn-small" id="btn-clear-all">Clear all</button>
    </div>
  </div>

  <div class="config-card">
    <h2>Difficulty</h2>
    <div id="difficulty-buttons">
      <button class="diff-btn selected" data-diff="easy">Easy</button>
      <button class="diff-btn" data-diff="medium">Medium</button>
      <button class="diff-btn" data-diff="hard">Hard</button>
      <button class="diff-btn" data-diff="division">Division</button>
    </div>
  </div>

  <div class="config-card">
    <h2>Goal</h2>
    <div id="goal-config">
      <label class="goal-radio-label">
        <input type="radio" name="goal-type" value="tasks" checked> Tasks
      </label>
      <label class="goal-radio-label">
        <input type="radio" name="goal-type" value="time"> Time
      </label>
      <input type="number" id="goal-value" min="1" max="999" value="10">
      <span id="goal-unit">tasks</span>
    </div>
  </div>

  <span id="config-error" class="hidden"></span>
  <button class="btn btn-primary btn-lg" id="btn-start">Start Game ▶</button>
</div>

<!-- ══════════════ GAME SCREEN ══════════════ -->
<div id="screen-game" class="hidden">
  <div id="game-header">
    <div id="progress-display">—</div>
    <div id="progress-bar-wrap"><div id="progress-bar"></div></div>
    <div class="game-header-actions">
      <button class="btn btn-secondary btn-small" id="btn-next">Next ▶</button>
      <button class="btn btn-secondary btn-small" id="btn-quit">Quit</button>
    </div>
  </div>

  <div id="grid-container">
    <table id="multiplication-grid"></table>
  </div>

  <div id="submit-row">
    <button class="btn btn-primary btn-lg" id="btn-submit">Check Answers ✓</button>
  </div>
</div>

<!-- ══════════════ END SCREEN ══════════════ -->
<div id="screen-end" class="hidden">
  <h1>Well done! 🎉</h1>
  <div class="score-card">
    <div class="score-row"><span>Correct answers</span><span class="score-val" id="end-correct">—</span></div>
    <div class="score-row"><span>Total attempts</span><span class="score-val" id="end-attempts">—</span></div>
    <div class="score-row"><span>Accuracy</span><span class="score-val" id="end-accuracy">—</span></div>
    <div class="score-row"><span>Time spent</span><span class="score-val" id="end-time">—</span></div>
  </div>
  <button class="btn btn-primary btn-lg" id="btn-play-again">Play Again</button>
</div>

<script>
// ═══════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════
const STATE = {
  selectedNumbers: [],
  difficulty: 'easy',
  goalType: 'tasks',
  goalValue: 10,

  screen: 'config',
  round: 0,
  hiddenCells: [],        // [{rowIdx, colIdx, answer}]
  divisionClueRowIdx: null,

  tasksCompleted: 0,
  tasksAttempted: 0,
  timerSeconds: 0,
  timerInterval: null,
  startTime: null,

  lastHiddenKeys: new Set(),
};

// ═══════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function randInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function formatTime(seconds) {
  const m = Math.floor(seconds / 60);
  const s = seconds % 60;
  return `${m}:${s.toString().padStart(2, '0')}`;
}

function elapsedSeconds() {
  return STATE.startTime ? Math.round((Date.now() - STATE.startTime) / 1000) : 0;
}

// ═══════════════════════════════════════════════════
// SCREEN TRANSITIONS
// ═══════════════════════════════════════════════════
function showScreen(name) {
  ['config', 'game', 'end'].forEach(s => {
    document.getElementById('screen-' + s).classList.toggle('hidden', s !== name);
  });
  STATE.screen = name;
}

// ═══════════════════════════════════════════════════
// CONFIG SCREEN
// ═══════════════════════════════════════════════════
function initNumberCheckboxes() {
  const container = document.getElementById('number-checkboxes');
  for (let n = 1; n <= 10; n++) {
    const label = document.createElement('label');
    label.className = 'num-checkbox-label checked';
    label.dataset.num = n;
    const input = document.createElement('input');
    input.type = 'checkbox';
    input.value = n;
    input.checked = true;
    input.addEventListener('change', () => {
      label.classList.toggle('checked', input.checked);
    });
    label.appendChild(input);
    label.appendChild(document.createTextNode(n));
    container.appendChild(label);
  }
}

function getCheckedNumbers() {
  return [...document.querySelectorAll('#number-checkboxes input:checked')]
    .map(el => parseInt(el.value))
    .sort((a, b) => a - b);
}

function setAllCheckboxes(checked) {
  document.querySelectorAll('#number-checkboxes input').forEach(input => {
    input.checked = checked;
    input.closest('label').classList.toggle('checked', checked);
  });
}

function getSelectedDifficulty() {
  return document.querySelector('.diff-btn.selected')?.dataset.diff || 'easy';
}

function readConfig() {
  const nums = getCheckedNumbers();
  if (nums.length < 2) {
    showConfigError('Please select at least 2 numbers.');
    return false;
  }
  hideConfigError();
  STATE.selectedNumbers = nums;
  STATE.difficulty = getSelectedDifficulty();
  STATE.goalType = document.querySelector('input[name="goal-type"]:checked').value;
  STATE.goalValue = Math.max(1, parseInt(document.getElementById('goal-value').value) || 10);
  return true;
}

function showConfigError(msg) {
  const el = document.getElementById('config-error');
  el.textContent = msg;
  el.classList.remove('hidden');
}

function hideConfigError() {
  document.getElementById('config-error').classList.add('hidden');
}

// ═══════════════════════════════════════════════════
// GRID GENERATION
// ═══════════════════════════════════════════════════
function buildGrid() {
  return { rows: STATE.selectedNumbers, cols: STATE.selectedNumbers };
}

function getCellValue(r, c) { return r * c; }

// ═══════════════════════════════════════════════════
// CELL HIDING
// ═══════════════════════════════════════════════════
function selectHiddenCells(grid) {
  const { rows, cols } = grid;
  const allCells = [];
  rows.forEach((r, ri) => cols.forEach((c, ci) => allCells.push({ rowIdx: ri, colIdx: ci, answer: getCellValue(r, c) })));

  if (STATE.difficulty === 'division') {
    selectDivisionSetup(grid);
    return;
  }

  let count;
  if (STATE.difficulty === 'easy')   count = 1;
  else if (STATE.difficulty === 'medium') count = Math.min(randInt(3, 5), allCells.length);
  else count = Math.max(1, Math.floor(allCells.length / 2));

  const preferred = allCells.filter(c => !STATE.lastHiddenKeys.has(`${c.rowIdx},${c.colIdx}`));
  const pool = preferred.length >= count ? preferred : allCells;
  const chosen = shuffle(pool).slice(0, count);

  STATE.hiddenCells = chosen;
  STATE.lastHiddenKeys = new Set(chosen.map(c => `${c.rowIdx},${c.colIdx}`));
  STATE.divisionClueRowIdx = null;
}

function selectDivisionSetup(grid) {
  const { rows, cols } = grid;
  const clueRowIdx = randInt(0, rows.length - 1);
  STATE.divisionClueRowIdx = clueRowIdx;
  // Hidden "cells" are the column headers — represented with rowIdx = -1
  STATE.hiddenCells = cols.map((c, ci) => ({ rowIdx: -1, colIdx: ci, answer: c }));
  STATE.lastHiddenKeys = new Set();
}

// ═══════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════
function renderGrid() {
  const grid = buildGrid();
  const table = document.getElementById('multiplication-grid');
  table.innerHTML = '';
  table.classList.add('grid-enter');
  table.addEventListener('animationend', () => table.classList.remove('grid-enter'), { once: true });

  renderTableHeader(table, grid);
  renderTableBody(table, grid);
  focusFirstInput();
}

function renderTableHeader(table, grid) {
  const isDivision = STATE.difficulty === 'division';
  const thead = table.createTHead();
  const tr = thead.insertRow();

  // Corner cell
  const corner = document.createElement('th');
  corner.textContent = isDivision ? '÷' : '×';
  tr.appendChild(corner);

  grid.cols.forEach((c, ci) => {
    const th = document.createElement('th');
    if (isDivision) {
      const input = document.createElement('input');
      input.type = 'number';
      input.className = 'cell-input';
      input.dataset.answer = c;
      input.dataset.headerCol = ci;
      input.setAttribute('aria-label', `Column header ${ci + 1}`);
      th.appendChild(input);
    } else {
      th.textContent = c;
    }
    tr.appendChild(th);
  });
}

function renderTableBody(table, grid) {
  const { rows, cols } = grid;
  const isDivision = STATE.difficulty === 'division';
  const hiddenSet = new Set(STATE.hiddenCells.map(h => `${h.rowIdx},${h.colIdx}`));
  const tbody = table.createTBody();

  rows.forEach((r, ri) => {
    const tr = tbody.insertRow();
    const isClue = isDivision && ri === STATE.divisionClueRowIdx;
    if (isClue) tr.classList.add('clue-row');

    // Row header
    const th = document.createElement('th');
    th.textContent = r;
    if (isClue) th.classList.add('clue-row-label');
    tr.appendChild(th);

    cols.forEach((c, ci) => {
      const td = tr.insertCell();
      const val = getCellValue(r, c);

      if (!isDivision && hiddenSet.has(`${ri},${ci}`)) {
        const input = createCellInput(val, ri, ci, r, c);
        td.appendChild(input);
      } else {
        const span = document.createElement('span');
        span.textContent = val;
        if (isDivision && !isClue) {
          td.classList.add('cell-dim');
        }
        td.appendChild(span);
      }
    });
  });
}

function createCellInput(answer, ri, ci, r, c) {
  const input = document.createElement('input');
  input.type = 'number';
  input.className = 'cell-input';
  input.dataset.answer = answer;
  input.dataset.row = ri;
  input.dataset.col = ci;
  input.setAttribute('aria-label', `${r} times ${c}`);
  return input;
}

function focusFirstInput() {
  const first = document.querySelector('#multiplication-grid .cell-input');
  if (first) first.focus();
}

// ═══════════════════════════════════════════════════
// VALIDATION + FEEDBACK
// ═══════════════════════════════════════════════════
function submitAnswers() {
  const inputs = [...document.querySelectorAll('#multiplication-grid .cell-input')];
  if (inputs.length === 0) return;

  STATE.tasksAttempted++;
  let allCorrect = true;

  inputs.forEach(input => {
    const answer = parseInt(input.dataset.answer);
    const given = parseInt(input.value);
    const correct = !isNaN(given) && given === answer;
    if (!correct) allCorrect = false;
    markCell(input, correct);
  });

  if (allCorrect) {
    incrementTaskCount();
    // auto-advance after brief delay
    setTimeout(() => {
      if (STATE.screen === 'game') nextRound();
    }, 700);
  } else {
    setTimeout(() => clearWrongInputs(), 500);
  }
}

function markCell(inputEl, correct) {
  const cell = inputEl.parentElement; // td or th
  cell.classList.remove('animate-correct', 'animate-correct-hdr', 'animate-wrong');

  if (correct) {
    const isHeader = inputEl.dataset.headerCol !== undefined;
    cell.classList.add(isHeader ? 'animate-correct-hdr' : 'animate-correct');
    // replace input with static text
    const span = document.createElement('span');
    span.className = 'cell-revealed-text';
    span.textContent = inputEl.dataset.answer;
    cell.replaceChild(span, inputEl);
  } else {
    cell.classList.add('animate-wrong');
    cell.addEventListener('animationend', () => cell.classList.remove('animate-wrong'), { once: true });
  }
}

function clearWrongInputs() {
  const inputs = [...document.querySelectorAll('#multiplication-grid .cell-input')];
  inputs.forEach(input => { input.value = ''; });
  focusFirstInput();
}

// ═══════════════════════════════════════════════════
// PROGRESS
// ═══════════════════════════════════════════════════
function incrementTaskCount() {
  STATE.tasksCompleted++;
  updateProgressDisplay();
  if (STATE.goalType === 'tasks' && STATE.tasksCompleted >= STATE.goalValue) {
    setTimeout(endGame, 800);
  }
}

function updateProgressDisplay() {
  const el = document.getElementById('progress-display');
  const bar = document.getElementById('progress-bar');

  if (STATE.goalType === 'tasks') {
    el.textContent = `${STATE.tasksCompleted} / ${STATE.goalValue}`;
    bar.style.width = `${Math.min(100, (STATE.tasksCompleted / STATE.goalValue) * 100)}%`;
  } else {
    el.textContent = formatTime(STATE.timerSeconds);
    const total = STATE.goalValue * 60;
    bar.style.width = `${Math.min(100, (STATE.timerSeconds / total) * 100)}%`;
    if (STATE.timerSeconds <= 30) el.classList.add('animate-pulse');
    else el.classList.remove('animate-pulse');
  }
}

function startTimer() {
  STATE.timerSeconds = STATE.goalValue * 60;
  updateProgressDisplay();
  STATE.timerInterval = setInterval(() => {
    STATE.timerSeconds--;
    updateProgressDisplay();
    if (STATE.timerSeconds <= 0) {
      stopTimer();
      endGame();
    }
  }, 1000);
}

function stopTimer() {
  if (STATE.timerInterval) {
    clearInterval(STATE.timerInterval);
    STATE.timerInterval = null;
  }
}

// ═══════════════════════════════════════════════════
// GAME FLOW
// ═══════════════════════════════════════════════════
function startGame() {
  if (!readConfig()) return;

  STATE.round = 0;
  STATE.tasksCompleted = 0;
  STATE.tasksAttempted = 0;
  STATE.timerInterval = null;
  STATE.startTime = Date.now();
  STATE.lastHiddenKeys = new Set();

  showScreen('game');
  updateProgressDisplay();

  const grid = buildGrid();
  selectHiddenCells(grid);
  renderGrid();

  if (STATE.goalType === 'time') startTimer();
}

function nextRound() {
  STATE.round++;
  const grid = buildGrid();
  selectHiddenCells(grid);
  renderGrid();
}

function endGame() {
  stopTimer();
  showEndScreen();
}

function showEndScreen() {
  const elapsed = elapsedSeconds();
  const accuracy = STATE.tasksAttempted > 0
    ? Math.round((STATE.tasksCompleted / STATE.tasksAttempted) * 100)
    : 0;

  document.getElementById('end-correct').textContent = STATE.tasksCompleted;
  document.getElementById('end-attempts').textContent = STATE.tasksAttempted;
  document.getElementById('end-accuracy').textContent = accuracy + '%';
  document.getElementById('end-time').textContent = formatTime(elapsed);

  showScreen('end');
}

// ═══════════════════════════════════════════════════
// EVENT WIRING
// ═══════════════════════════════════════════════════
function initEvents() {
  // Config
  document.getElementById('btn-select-all').addEventListener('click', () => setAllCheckboxes(true));
  document.getElementById('btn-clear-all').addEventListener('click', () => setAllCheckboxes(false));

  document.querySelectorAll('.diff-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
    });
  });

  document.querySelectorAll('input[name="goal-type"]').forEach(radio => {
    radio.addEventListener('change', () => {
      document.getElementById('goal-unit').textContent =
        radio.value === 'tasks' ? 'tasks' : 'minutes';
    });
  });

  document.getElementById('btn-start').addEventListener('click', startGame);

  // Game
  document.getElementById('btn-submit').addEventListener('click', submitAnswers);
  document.getElementById('btn-next').addEventListener('click', nextRound);
  document.getElementById('btn-quit').addEventListener('click', endGame);

  document.getElementById('screen-game').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); submitAnswers(); }
  });

  // End
  document.getElementById('btn-play-again').addEventListener('click', () => showScreen('config'));
}

// ═══════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', () => {
  initNumberCheckboxes();
  initEvents();
  showScreen('config');
});
</script>
